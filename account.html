<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Bookings - EXE TOURS</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/responsive.css" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#fc036b" />
        <style>
            .account-wrap {
                max-width: 1100px;
                width: 100%;
                margin: 120px auto 80px;
                padding: 0 1em;
            }
            .tour-options {
                margin-top: 2rem;
            }
            .tour-options-header {
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 1rem;
                margin-bottom: 1rem;
            }
            .tour-options-header p {
                color: #bbb;
                max-width: 50ch;
            }
            .tour-catalog {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 1rem;
            }
            .tour-option {
                display: flex;
                flex-direction: column;
                background: #222;
                border-radius: 0.6rem;
                overflow: hidden;
                min-width: 0;
            }
            .tour-option img {
                width: 100%;
                aspect-ratio: 16 / 9;
                object-fit: cover;
            }
            .tour-option-body {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0.55rem;
                padding: 1rem;
                flex: 1;
            }
            .tour-option-body h3 {
                color: white;
                font-family: var(--ff-lora);
            }
            .tour-option-date,
            .tour-option-price {
                color: #ccc;
                font-size: 0.9rem;
            }
            .tour-option-body .book-btn,
            .booking-pay-btn {
                margin-top: auto;
                border: 0;
                border-radius: 999px;
                padding: 0.65rem 1rem;
                background: #fc036b;
                color: white;
                font-weight: 700;
                cursor: pointer;
            }
            .tour-option-body button:disabled,
            .booking-pay-btn:disabled {
                opacity: 0.65;
                cursor: wait;
            }
            .tour-catalog-message {
                color: #ccc;
                padding: 1rem 0;
            }
            .account-grid {
                display: grid;
                grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.5fr);
                gap: 1.5rem;
                align-items: start;
            }
            .profile-panel {
                background: #222;
                border-radius: 0.6rem;
                padding: 1.25rem;
            }
            .profile-heading {
                display: flex;
                align-items: center;
                gap: 1rem;
                margin-bottom: 1rem;
            }
            .profile-avatar {
                width: 76px;
                height: 76px;
                flex: 0 0 76px;
                border-radius: 50%;
                object-fit: cover;
                background: #484872;
                border: 3px solid #fc036b;
            }
            .profile-form label {
                color: #ddd;
                display: block;
                padding: 0;
                margin: 0.8rem 0 0.3rem;
            }
            .profile-form input,
            .profile-form textarea {
                width: 100%;
                padding: 0.7rem;
                border: 1px solid #555;
                border-radius: 4px;
            }
            .profile-form textarea {
                min-height: 90px;
            }
            .profile-form input[type="file"] {
                color: #ddd;
                border: 0;
                padding: 0.4rem 0;
            }
            .notification-toggle {
                display: flex !important;
                gap: 0.6rem;
                align-items: center;
                margin: 1rem 0 !important;
            }
            .notification-toggle input {
                width: auto;
            }
            .profile-save {
                width: 100%;
                border: 0;
                padding: 0.75rem 1rem;
                border-radius: 999px;
                background: #fc036b;
                color: white;
                font-weight: 700;
                cursor: pointer;
            }
            .profile-save:disabled {
                opacity: 0.65;
                cursor: wait;
            }
            .profile-message {
                min-height: 1.25rem;
                margin-top: 0.75rem;
                color: #b7f7c2;
            }
            .bookings-panel {
                min-width: 0;
            }
            .account-bookings-table {
                min-width: 0;
            }
            .status-pill {
                padding: 2px 10px;
                border-radius: 100vmax;
                font-size: 0.85em;
            }
            .status-paid {
                background: #2e7d32;
            }
            .status-pending {
                background: #b26a00;
            }
            .status-cancelled {
                background: #7c7c7c;
            }
            @media (max-width: 850px) {
                .account-grid {
                    grid-template-columns: minmax(0, 1fr);
                }
                .account-grid > section,
                .tour-options {
                    width: 100%;
                    margin-left: 0;
                    margin-right: 0;
                }
            }
            @media (max-width: 600px) {
                .account-bookings-table {
                    display: block;
                    width: 100%;
                    min-width: 0;
                    margin: 0;
                    background: transparent;
                    box-shadow: none;
                }
                .account-bookings-table thead {
                    display: none;
                }
                .account-bookings-table tbody {
                    display: grid;
                    gap: 0.75rem;
                }
                .account-bookings-table tr {
                    display: grid;
                    gap: 0.55rem;
                    padding: 0.9rem;
                    border: 1px solid #444;
                    border-radius: 0.6rem;
                    background: #222;
                }
                .account-bookings-table tr:nth-child(even),
                .account-bookings-table tr:hover {
                    background: #222;
                }
                .account-bookings-table td {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 0.75rem;
                    min-width: 0;
                    padding: 0.2rem 0;
                    border: 0;
                    text-align: right;
                }
                .account-bookings-table td[data-label]::before {
                    content: attr(data-label);
                    flex: 0 0 auto;
                    color: #aaa;
                    font-size: 0.78rem;
                    font-weight: 700;
                    letter-spacing: 0.03em;
                    text-align: left;
                    text-transform: uppercase;
                }
                .account-bookings-table td[colspan] {
                    display: block;
                    text-align: center;
                    color: #ccc;
                }
                .account-bookings-table .booking-pay-btn {
                    width: auto;
                    min-width: 96px;
                    padding: 0.55rem 0.75rem;
                }
            }
        </style>
    </head>
    <body>
        <nav class="navbar glass" style="height: 70px">
            <span
                ><a href="index.html" style="display: flex; align-items: center"
                    ><img
                        class="img2"
                        src="./img/mountain.png"
                        width="40"
                        style="margin: -25px -10px -25px -20px"
                    />
                    <h1 class="logo">&nbsp;EXETOURS</h1></a
                ></span
            >
        </nav>

        <div class="account-wrap">
            <div class="account-grid">
                <section class="profile-panel" aria-labelledby="profile-title">
                    <div class="profile-heading">
                        <img class="profile-avatar" id="profile-avatar" src="img/mountain.png" alt="Profile photo" />
                        <div>
                            <h2 id="profile-title" class="font-color">Plan your visit</h2>
                            <p>Keep your trip details ready for our team.</p>
                        </div>
                    </div>
                    <form class="profile-form" id="profile-form">
                        <label for="profile-name">Name</label>
                        <input id="profile-name" name="name" type="text" autocomplete="name" required />
                        <label for="profile-phone">Phone</label>
                        <input id="profile-phone" name="phone" type="tel" autocomplete="tel" placeholder="+233 ..." />
                        <label for="profile-country">Home country or city</label>
                        <input id="profile-country" name="country" type="text" autocomplete="country-name" />
                        <label for="profile-preferences">Travel preferences</label>
                        <textarea id="profile-preferences" name="travel_preferences" placeholder="Group size, interests, accessibility needs, preferred dates..."></textarea>
                        <label for="profile-avatar-input">Profile photo</label>
                        <input id="profile-avatar-input" name="avatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />
                        <label class="notification-toggle" for="email-notifications">
                            <input id="email-notifications" type="checkbox" checked />
                            Email me about payment status and tour dates
                        </label>
                        <button class="profile-save" type="submit">Save planning details</button>
                        <p class="profile-message" id="profile-message" role="status" aria-live="polite"></p>
                    </form>
                </section>

                <section class="bookings-panel" aria-labelledby="bookings-title">
                    <div class="title" style="margin-bottom: 1em">
                        <h1 id="bookings-title" class="font-color">My Tour Plan</h1>
                        <div class="line"></div>
                    </div>
                    <div class="table-wrap">
                        <table class="tours-table account-bookings-table" id="bookings-table">
                            <thead>
                                <tr>
                                    <th>Tour</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Next step</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-tbody">
                                <tr>
                                    <td colspan="5">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <section class="tour-options" aria-labelledby="tour-options-title">
                <div class="tour-options-header">
                    <div>
                        <h2 id="tour-options-title" class="font-color">Choose your next adventure</h2>
                        <div class="line" style="margin-left: 0"></div>
                    </div>
                    <p>Browse upcoming tours, start a booking, and continue to secure payment from one place.</p>
                </div>
                <div class="tour-catalog" id="tour-catalog">
                    <p class="tour-catalog-message">Loading available tours...</p>
                </div>
            </section>
        </div>

        <script src="js/api.js"></script>
        <script src="js/account.js"></script>
    </body>
</html>
